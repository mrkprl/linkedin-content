# Fonti che scripts/scout.py scansiona a ogni esecuzione della routine.
# Per aggiungerne una basta una voce nuova; se il dominio non è nella lista
# "Allowed domains" dell'environment cloud, lo script la segnala come non raggiungibile.
#
# ruolo:
#   ufficiale  fonte primaria: un fatto di prodotto si cita solo da qui
#   stampa     stampa tech di qualità: vale come fonte se il fatto non è un annuncio
#   spunto     newsletter e community: danno idee e mostrano cosa interessa,
#              ma nessun fatto può poggiare solo su di loro
#
# tipo:
#   feed       RSS o Atom
#   hn         ricerca Hacker News (url = parola da cercare)
#   pagina     nessun feed: la routine la legge con WebFetch

