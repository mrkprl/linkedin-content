name: Pubblica i post programmati

# I post preparati in anticipo stanno in programmati/AAAA-MM-GG.md, con le
# illustrazioni in images/AAAA-MM-GG/. Ogni giorno questa Action pubblica il post
# del giorno all'ora scritta in orari.yaml (o in `ora:` nel post, ora di Roma) e
# lo sposta in published/.
#
# Gli orari programmati di GitHub partono spesso con ore di ritardo (a ottobre
# 2026 anche 5 ore). Per questo i tentativi partono presto: se la corsa arriva
# prima dell'ora del post, aspetta fino a quell'ora (al massimo 5 ore e 40) e poi
# pubblica. Se arriva tardi, pubblica subito. Il primo tentativo valido pubblica e sposta il file; quelli
# dopo non trovano più niente da fare. Il repo è pubblico, quindi l'attesa non
# consuma minuti a pagamento.

on:
  schedule:
    - cron: '13 1 * * *'
    - cron: '13 2 * * *'
    - cron: '13 3 * * *'
    - cron: '43 4 * * *'
    - cron: '43 6 * * *'
    - cron: '17 7 * * *'
    - cron: '13 8 * * *'
    - cron: '17 9 * * *'
    - cron: '43 10 * * *'
  workflow_dispatch:
    inputs:
      data:
        description: 'Data del post da pubblicare subito (AAAA-MM-GG). Vuoto = quello di oggi'
        required: false

permissions:
  contents: write

concurrency:
  group: pubblica-programmati
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sempre l'ultimo main, non il commit di quando è scattato l'orario:
          # una corsa rimasta in coda deve vedere il post già spostato da quella
          # prima (il 9 novembre 2026 il post di Gemini è uscito due volte così).
          ref: main

      - name: Trova il post del giorno
        id: post
        env:
          DATA_SCELTA: ${{ inputs.data }}
          EVENTO: ${{ github.event_name }}
        run: |
          DATA="$DATA_SCELTA"
          if [ -n "$DATA" ]; then
            if ! [[ "$DATA" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::Data non valida: usa AAAA-MM-GG"
              exit 1
            fi
          else
            DATA=$(TZ=Europe/Rome date +%F)
            ORARIO=$(python3 scripts/orario.py "$DATA")
            ATTESA=$(( $(TZ=Europe/Rome date -d "$DATA $ORARIO" +%s) - $(date +%s) ))
            if [ "$EVENTO" = "schedule" ] && [ "$ATTESA" -gt 0 ]; then
              if [ "$ATTESA" -gt 20400 ]; then
                echo "Il post del $DATA esce alle $ORARIO: troppo presto, ci pensa un tentativo dopo."
                exit 0
              fi
              echo "Il post del $DATA esce alle $ORARIO: aspetto $ATTESA secondi."
              sleep "$ATTESA"
            fi
          fi
          FILE="programmati/${DATA}.md"
          if [ -f "$FILE" ]; then
            echo "file=$FILE" >> "$GITHUB_OUTPUT"
            echo "data=$DATA" >> "$GITHUB_OUTPUT"
            echo "Da pubblicare: $FILE"
          else
            echo "Nessun post programmato per il $DATA."
          fi

      - name: Set up Python
        if: steps.post.outputs.file != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.post.outputs.file != ''
        run: pip install requests PyYAML Pillow

      - name: Controlli
        if: steps.post.outputs.file != ''
        run: |
          python scripts/test_publish.py
          python scripts/test_image.py
          python scripts/test_carousel.py
          python scripts/test_orario.py
          python scripts/readability.py "${{ steps.post.outputs.file }}" || true

      - name: Controlla che non sia già uscito
        id: ancora
        if: steps.post.outputs.file != ''
        env:
          FILE: ${{ steps.post.outputs.file }}
        run: |
          # Dopo l'attesa fino all'ora del post, un'altra corsa può averlo già
          # pubblicato e spostato: si guarda main com'è adesso.
          git fetch --quiet origin main
          if git cat-file -e "origin/main:${FILE}" 2>/dev/null; then
            echo "pubblica=si" >> "$GITHUB_OUTPUT"
          else
            echo "Il post ${FILE} non è più in main: l'ha già pubblicato un'altra corsa."
          fi

      - name: Pubblica su LinkedIn
        if: steps.ancora.outputs.pubblica == 'si'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          NEW_FILES: ${{ steps.post.outputs.file }}
        run: python scripts/publish.py

      - name: Sposta in published/
        if: steps.ancora.outputs.pubblica == 'si'
        env:
          DATA: ${{ steps.post.outputs.data }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions"
          git mv "programmati/${DATA}.md" "published/${DATA}.md"
          git add images/ 2>/dev/null || true
          git commit -m "publish: post programmato del ${DATA} [skip ci]"
          git pull --rebase origin main
          git push
