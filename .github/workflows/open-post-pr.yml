name: Open Post PR

on:
  push:
    branches:
      - 'post/**'

permissions:
  contents: write        # per committare l'anteprima dell'immagine sul branch
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests PyYAML Pillow

      - name: Open approval PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="$GITHUB_REF_NAME"
          POST_DATE="${BRANCH#post/}"
          FILE="approved/${POST_DATE}.md"

          if [ ! -f "$FILE" ]; then
            echo "Nessun file $FILE su questo branch, niente da fare."
            exit 0
          fi

          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" != "0" ]; then
            echo "PR già aperta per $BRANCH."
            exit 0
          fi

          TOPIC=$(awk -F': *' '$1=="topic" {print $2; exit}' "$FILE")

          # Anteprima dell'infografica: si disegna dal blocco immagine del
          # frontmatter e si committa sul branch, così la PR la mostra da telefono.
          # Niente [skip ci] nel messaggio: con lo squash merge finirebbe nel
          # commit su main e salterebbe la pubblicazione.
          IMG="images/${POST_DATE}.png"
          RENDER=$(python scripts/render_image.py "$FILE" 2>&1) || true
          echo "$RENDER"
          ANTEPRIMA=""
          if [ -f "$IMG" ] && [ -z "$(git status --porcelain -- "$IMG")" ]; then
            ANTEPRIMA="si"   # già committata dal generatore
          elif [ -f "$IMG" ]; then
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "GitHub Actions"
            git add "$IMG"
            git commit -m "image: anteprima ${POST_DATE}"
            # Se il push fallisce la PR si apre lo stesso, senza anteprima.
            if git push origin HEAD:"$BRANCH"; then
              ANTEPRIMA="si"
            else
              echo "::warning::Push dell'anteprima fallito, la PR si apre senza immagine"
            fi
          fi
          SHA=$(git rev-parse HEAD)

          {
            echo "✅ **Merge** = pubblica su LinkedIn · ❌ **Close** = scarta il post"
            echo
            if [ -n "$ANTEPRIMA" ]; then
              echo "![Immagine del post](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/${IMG})"
              echo
            elif [ -f "$IMG" ]; then
              echo "⚠️ Anteprima non caricata: l'immagine viene comunque ridisegnata e pubblicata con il Merge."
              echo
            elif grep -q '^immagine:' "$FILE"; then
              echo "⚠️ **Immagine non disegnata**: se fai Merge esce solo il testo."
              echo
              echo '```'
              echo "$RENDER"
              echo '```'
              echo
            fi
            echo "---"
            echo
            awk 'fm>=2 {print} /^---[[:space:]]*$/ {fm++}' "$FILE"
            echo
            echo "---"
            echo
            echo '```'
            python scripts/readability.py "$FILE" 2>&1 || true
            echo '```'
          } > /tmp/pr-body.md

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "📱 Post LinkedIn ${POST_DATE} — ${TOPIC:-post}" \
            --body-file /tmp/pr-body.md

          gh pr edit "$BRANCH" --add-reviewer mrkprl --add-assignee mrkprl || true
