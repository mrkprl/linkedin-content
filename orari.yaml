# Ora di pubblicazione dei post programmati, ora di Roma, giorno per giorno.
# La legge scripts/orario.py. Un post può avere un orario suo con `ora: "HH:MM"`
# nel frontmatter, che vince su questo file. Senza indicazioni si pubblica alle 8:00.
#
# Prova di novembre 2026: settimana 1 (9-13 novembre) al mattino (lun 12:00,
# mar-ven 8:30), settimana 2 (16-20 novembre) a pranzo, alle 12:30. Poi si
# confrontano le impression a 24 ore.
lunedi: "12:30"
martedi: "12:30"
mercoledi: "12:30"
giovedi: "12:30"
venerdi: "12:30"
sabato: "10:00"
domenica: "10:00"
